name: Data Pipeline CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: Install Java (for PySpark)
      run: |
        sudo apt-get update
        sudo apt-get install -y default-jre

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyspark==3.5.1 pytest

    - name: Run Data Pipeline and Tests
      run: |
        # Generate data from the root directory
        python generator/run.py --scale 0.01
        # Build the Silver and Gold layers
        python spark/bronze_to_silver.py
        python spark/silver_to_gold.py
        # Run automated data quality tests
        python -m pytest tests/ -v
